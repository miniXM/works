<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VideoMix 授权中心</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b8def'/%3E%3Cpath d='M9 11h9l5 5-5 5H9z' fill='%23fff'/%3E%3C/svg%3E">
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center; text-align: center;
    background: #f5f6fa; color: #6b7280;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; font-size: 14px;
  }
  .boot-link { color: #4a7de0; }
</style>
</head>
<body>
<div>正在打开授权中心…<br><br>
  <a class="boot-link" href="/pc.html">电脑版</a> ·
  <a class="boot-link" href="/m.html">手机版</a>
</div>
<script>
/* 同一个域名、同一个后端：电脑进 PC 后台，手机进 H5。
   支持 ?view=pc / ?view=mobile 手动指定，?view=auto 清除记忆。 */
(function () {
  var VIEW_KEY = 'vm-admin-view';
  var params = new URLSearchParams(location.search || '');
  var forced = (params.get('view') || '').toLowerCase();
  var stored = '';
  try { stored = localStorage.getItem(VIEW_KEY) || ''; } catch (e) { }

  if (forced === 'auto') {
    try { localStorage.removeItem(VIEW_KEY); } catch (e) { }
    forced = '';
  }

  var view = forced === 'pc' || forced === 'mobile' ? forced : stored;
  if (view !== 'pc' && view !== 'mobile') {
    var ua = navigator.userAgent || '';
    var mobileUa = /Android|iPhone|iPod|iPad|Windows Phone|HarmonyOS|Mobile|MicroMessenger|QQ\//i.test(ua);
    var narrow = false;
    try {
      narrow = window.matchMedia('(max-width: 820px)').matches &&
        window.matchMedia('(pointer: coarse)').matches;
    } catch (e) { }
    view = mobileUa || narrow ? 'mobile' : 'pc';
  }

  if (forced === 'pc' || forced === 'mobile') {
    try { localStorage.setItem(VIEW_KEY, forced); } catch (e) { }
  }

  var path = location.pathname || '/';
  var base = path.slice(0, path.lastIndexOf('/') + 1) || '/';
  location.replace(base + (view === 'mobile' ? 'm.html' : 'pc.html') + (location.hash || ''));
})();
</script>
</body>
</html>
