# =====================================================================
# VideoMix 授权中心 · 宝塔站点配置示例（nginx + PHP-FPM）
#
# 用法：宝塔 → 网站 → 你的站点 → 设置 → 配置文件，把下面 location 部分
#      替换进 server{} 里；注意 root 指向项目的 public 目录。
#      在宝塔面板里操作时，改「网站目录」为 .../public 更简单，见部署文档。
# =====================================================================

server {
    listen 80;
    server_name license.你的域名.com;

    # ★ 关键：网站根目录必须是项目的 public 子目录
    root /www/wwwroot/videomix-license/public;
    index index.php index.html;

    # ★ 关键：客户端要上传最大 512 MB 的更新包
    client_max_body_size 512m;
    client_body_timeout 600s;
    send_timeout 600s;

    access_log /www/wwwlogs/videomix-license.log;

    # 静态资源（后台网页）直接由 nginx 发，速度快
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
        expires 1h;
        access_log off;
        try_files $uri =404;
    }

    # 所有 PHP 请求交给 index.php / install.php
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/tmp/php-cgi-74.sock;   # ★ 按宝塔里实际 PHP 版本改这一行
        fastcgi_index index.php;
        include fastcgi.conf;
        fastcgi_read_timeout 600s;
        fastcgi_send_timeout 600s;
        fastcgi_buffers 16 64k;
        fastcgi_buffer_size 128k;
    }

    # 其它所有请求都交给 index.php（/api/... /rpc/... /health /）
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { log_not_found off; access_log off; }
    location ~ /\.(?!well-known) { deny all; }   # 禁止访问 .git/.env 之类
}

# ---------------------------------------------------------------------
# 如果要加 HTTPS（强烈建议，客户端默认走 https 更安全）：
#   宝塔 → 网站 → SSL → Let's Encrypt 申请证书 → 打开「强制 HTTPS」
#   申请成功后宝塔会自动补上 443 那段 server{}，不用手写。
# ---------------------------------------------------------------------
