<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#f5f6fa">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>VideoMix 授权中心</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b8def'/%3E%3Cpath d='M9 11h9l5 5-5 5H9z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="web/app.css?v=2.5.4">
<link rel="stylesheet" href="web/mobile.css?v=2.5.4">
</head>
<body class="m-body">

<!-- 登录 -->
<div class="m-login" id="mLogin" hidden>
  <span class="m-login__logo">授权中心</span>
  <h1 class="m-login__title">VideoMix</h1>
  <p class="m-login__sub">手机端管理后台</p>
  <form class="m-login__card" id="mLoginForm" autocomplete="on">
    <div class="m-field">
      <label for="mUser">账号</label>
      <input id="mUser" name="username" type="text" autocomplete="username" placeholder="请输入账号" required>
    </div>
    <div class="m-field">
      <label for="mPass">密码</label>
      <input id="mPass" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required>
    </div>
    <button class="m-btn m-btn--primary m-btn--block" type="submit" id="mLoginBtn">登录</button>
    <p class="m-login__hint" id="mLoginHint">总账号与代理商账号使用同一个后台</p>
  </form>
</div>

<!-- 主界面 -->
<div class="m-app" id="mApp" hidden>
  <header class="m-header">
    <div class="m-header__title" id="mTitle">概览<span class="m-header__sub" id="mSub"></span></div>
    <span class="m-header__user" id="mWho"></span>
    <button class="m-header__btn" id="mRefresh" type="button">刷新</button>
  </header>
  <main class="m-body" id="mBody"></main>
  <nav class="m-tabs" id="mTabs"></nav>
</div>

<div class="m-sheet-mask" id="mSheetMask" hidden>
  <div class="m-sheet" id="mSheet" role="dialog" aria-modal="true"></div>
</div>
<div class="toast-wrap" id="mToasts"></div>

<script src="web/mobile.js?v=2.5.4"></script>
</body>
</html>
