      .vm-startup {
        min-height: 100%;
        display: grid;
        place-items: center;
        color: #1a3156;
      }

      .vm-startup__card {
        width: min(420px, calc(100vw - 48px));
        padding: 34px 38px;
        border: 1px solid rgba(91, 141, 239, 0.18);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.72);
        box-shadow: 0 24px 70px rgba(57, 78, 128, 0.16);

      }

      .vm-startup__brand {

        letter-spacing: 0.1em;
      }

      .vm-startup__title {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
      }

      .vm-startup__hint {
        margin: 12px 0 0;
        font-size: 14px;
        line-height: 1.7;
        color: #6b7890;
      }

      .vm-startup__bar {
        position: relative;
        overflow: hidden;
        height: 5px;
        margin-top: 24px;
        border-radius: 999px;
        background: #dbe7ff;
      }

      .vm-startup__bar::after {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 42%;
        border-radius: inherit;
        background: linear-gradient(90deg, #5b8def, #7ab8ff);
        animation: vm-startup-slide 1.25s ease-in-out infinite;
      }

      @keyframes vm-startup-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(240%);
        }
      }
