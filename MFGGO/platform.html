<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>智造云 · 平台主后台</title>
    <link rel="stylesheet" href="./cloud.css" />
    <link rel="stylesheet" href="./automation.css" />
    <link rel="stylesheet" href="./shadcn.css" />
    <link rel="stylesheet" href="./task-history.css?v=20260907-1" />
    <link rel="stylesheet" href="./organization-ui.css?v=20260907-4" />
    <link rel="stylesheet" href="./organization-chart.css" />
    <link rel="stylesheet" href="./task-recycle.css?v=20260907-1" />
    <link rel="stylesheet" href="./project-lists.css?v=20260909-1" />
    <link rel="stylesheet" href="./project-links.css?v=20260907-1" />
  </head>
  <body data-console-mode="platform">
    <div id="loginView" class="login-view">
      <div class="login-orbit orbit-one"></div>
      <div class="login-orbit orbit-two"></div>
      <section class="login-card">
        <div class="login-brand"><span>T</span><b>智造云</b></div>
        <p class="login-kicker">平台主后台 · 全部企业管理</p>
        <form id="loginForm" class="login-form">
          <label
            ><span><i>*</i> 用户名</span
            ><input
              id="loginUser"
              value="admin"
              autocomplete="username"
              required /></label
          ><label
            ><span><i>*</i> 密码</span>
            <div class="password-wrap">
              <input
                id="loginPassword"
                type="password"
                autocomplete="current-password"
                required
              /><button type="button" id="togglePassword" aria-label="显示密码">
                ◉
              </button>
            </div></label
          >
          <p id="loginError" class="login-error" role="alert"></p>
          <button class="login-button" type="submit">登 录</button>
        </form>
        <p class="login-hint">使用平台管理员账号登录</p>
      </section>
    </div>
    <div id="shellView" class="cloud-shell hidden">
      <aside class="cloud-sidebar">
        <div class="cloud-logo"><span>T</span><b>智造云</b></div>
        <nav id="cloudNav" class="cloud-nav" aria-label="平台主后台导航"></nav>
        <div class="sidebar-footer">
          <div class="user-chip">
            <span>A</span>
            <div><b id="cloudUserName">admin</b><small>在线</small></div>
          </div>
          <button id="logoutButton" class="logout-button">退出</button>
        </div>
      </aside>
      <main class="cloud-main">
        <header class="cloud-topbar">
          <div class="topbar-title">
            <h1 id="pageTitle">平台总览</h1>
            <div class="global-search">
              <span>⌕</span
              ><input
                id="globalSearch"
                placeholder="搜索企业 / 用户 / 审计记录"
                aria-label="全局搜索"
              /><kbd>⌘ K</kbd>
            </div>
          </div>
          <div class="topbar-actions">
            <button id="enterpriseMenu" class="enterprise-button" title="返回企业工作台" aria-label="返回企业工作台">
              平台管理⌄</button
            ><button class="top-user">
              <span>A</span><b>admin</b><i>⌄</i>
            </button>
          </div>
        </header>
        <div id="cloudContent" class="cloud-content"></div>
      </main>
    </div>
    <div id="cloudToast" class="cloud-toast" role="status"></div>
    <script type="module" src="./zhizao-app.js?v=20260910-participant-policy-4"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const i = document.querySelector("#loginPassword"),
          b = document.querySelector("#togglePassword");
        b?.addEventListener("click", () => {
          i.type = i.type === "password" ? "text" : "password";
          b.textContent = i.type === "password" ? "◉" : "◌";
        });
      });
    </script>
  </body>
</html>
