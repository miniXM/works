<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VideoMix 授权中心</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b8def'/%3E%3Cpath d='M9 11h9l5 5-5 5H9z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="web/app.css?v=2.5.4">
</head>
<body>

<!-- 登录 -->
<div class="login-page" id="loginPage" hidden>
  <span class="bg-light one"></span>
  <span class="bg-light two"></span>
  <form class="login-card" id="loginForm" autocomplete="on">
    <div class="login-logo">授权中心</div>
    <h1 class="login-title">VideoMix</h1>
    <p class="login-subtitle">激活码与代理商管理后台</p>
    <div class="field">
      <label>账号</label>
      <input id="loginUser" name="username" type="text" autocomplete="username" placeholder="请输入账号" required>
    </div>
    <div class="field">
      <label>密码</label>
      <input id="loginPass" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required>
    </div>
    <button class="btn btn-primary btn-block" type="submit" id="loginSubmit">登录</button>
    <p class="login-hint" id="loginHint">总账号与代理商账号使用同一个后台</p>
  </form>
</div>

<!-- 主界面 -->
<div class="app" id="app" hidden>
  <aside class="sidebar">
    <div class="sidebar__brand">
      <span class="sidebar__logo">VM</span>
      <span class="sidebar__name">授权中心</span>
    </div>
    <nav class="sidebar__nav" id="nav"></nav>
    <div class="sidebar__foot">
      <div class="sidebar__user" id="sidebarUser"></div>
      <button class="btn btn-ghost btn-block" id="logoutBtn">退出登录</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 class="topbar__title" id="pageTitle">概览</h1>
        <p class="topbar__sub" id="pageSub"></p>
      </div>
      <div class="topbar__right">
        <span class="tag tag-soft" id="roleBadge"></span>
        <button class="btn btn-ghost" id="refreshBtn" title="刷新">刷新</button>
      </div>
    </header>
    <section class="content" id="content"></section>
  </main>
</div>

<div class="modal-mask" id="modalMask" hidden>
  <div class="modal" id="modal"></div>
</div>
<div class="toast-wrap" id="toasts"></div>

<script src="web/app.js?v=2.5.4"></script>
</body>
</html>
