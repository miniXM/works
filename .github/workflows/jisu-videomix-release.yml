name: Desktop release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11.19.0'

defaults:
  run:
    working-directory: 极速混剪/客户端/源码/双平台

jobs:
  test:
    strategy:
      matrix: { os: [windows-latest, macos-13, macos-14] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: ${{ env.NODE_VERSION }} }
      - uses: pnpm/action-setup@v4
        with: { version: ${{ env.PNPM_VERSION }} }
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/*.test.cjs

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: ${{ env.NODE_VERSION }} }
      - uses: pnpm/action-setup@v4
        with: { version: ${{ env.PNPM_VERSION }} }
      - run: pnpm install --frozen-lockfile
      - name: Build Windows x64 installer
        run: pnpm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: videomix-windows-x64
          path: 极速混剪/客户端/源码/双平台/release/*
          if-no-files-found: error

  build-macos:
    needs: test
    strategy:
      matrix:
        include:
          - runner: macos-13
            arch: x64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: ${{ env.NODE_VERSION }} }
      - uses: pnpm/action-setup@v4
        with: { version: ${{ env.PNPM_VERSION }} }
      - run: pnpm install --frozen-lockfile
      - name: Build signed and notarized macOS package
        if: ${{ env.CSC_LINK != '' && env.CSC_KEY_PASSWORD != '' && env.APPLE_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '' && env.APPLE_TEAM_ID != '' }}
        run: pnpm run build:mac:${{ matrix.arch }}
      - name: Build unsigned macOS test package
        if: ${{ env.CSC_LINK == '' || env.CSC_KEY_PASSWORD == '' || env.APPLE_ID == '' || env.APPLE_APP_SPECIFIC_PASSWORD == '' || env.APPLE_TEAM_ID == '' }}
        run: pnpm exec electron-builder --mac dmg zip --${{ matrix.arch }} -c.mac.identity=null -c.mac.notarize=false -c.artifactName='${productName}-${version}-${os}-${arch}-unsigned-test.${ext}'
      - name: Validate signed DMG
        if: ${{ env.CSC_LINK != '' && env.CSC_KEY_PASSWORD != '' && env.APPLE_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '' && env.APPLE_TEAM_ID != '' }}
        run: for f in release/*.dmg; do xcrun stapler validate "$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: videomix-macos-${{ matrix.arch }}
          path: 极速混剪/客户端/源码/双平台/release/*
          if-no-files-found: error

  publish-release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: videomix-*
          merge-multiple: true
      - name: Publish installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
